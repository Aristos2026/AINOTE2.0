# Termux settings tuned for Claude Code on the AINOTE 2.
# Copy to ~/.termux/termux.properties and run `termux-reload-settings`.

# Two rows of extra keys above the on-screen keyboard: Esc, Tab, Ctrl and
# arrows are the keys Claude Code needs that Android keyboards lack.
extra-keys = [ \
  ['ESC','/','-','HOME','UP','END','PGUP'], \
  ['TAB','CTRL','ALT','LEFT','DOWN','RIGHT','PGDN'] \
]

# Claude Code rings the terminal bell when it finishes or needs input
# (preferredNotifChannel = terminal_bell). Turn that into a vibration.
bell-character = vibrate

# Volume keys stay volume keys (set to false to use them as Ctrl/Alt).
use-black-ui = false
